<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow</title>
<style>
:root{
  --bg:#f4eee1; --surface:#fffdf8; --ink:#1a1611; --ink2:#5f584a; --muted:#938a78; --line:#e7dec9;
  --you:#df7a2a; --ai:#7c6fd6; --code:#0f9d58; --art:#8a8578; --pot:#c98a1e;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Segoe UI",sans-serif;font-size:14px}
header{padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
  background:rgba(244,238,225,.92);backdrop-filter:blur(8px)}
header h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.btns{margin-left:auto;display:flex;gap:8px}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer}
button.on{background:var(--ink);color:#fdfaf2;border-color:var(--ink)}
.diagram{position:relative;padding:28px 24px;min-width:1180px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.cols{position:relative;z-index:1;display:grid;grid-template-columns:220px 300px 240px;gap:70px;align-items:start;justify-content:center}
.col{display:flex;flex-direction:column;gap:22px}
.col.center{gap:34px}
.node{background:var(--surface);border:1.5px solid var(--line);border-left-width:5px;border-radius:12px;
  padding:10px 12px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(60,45,20,.05);position:relative}
.node:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,45,20,.12)}
.node.sel{outline:2px solid var(--ink);outline-offset:1px}
.node .t{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.node .io{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.node .own{font-size:10px;font-weight:700;margin-top:5px;display:inline-block;padding:1px 7px;border-radius:999px}
.node .live{font-size:10px;font-weight:700;color:var(--code);margin-top:5px;display:block}
.node.you{border-left-color:var(--you)} .own.you{background:rgba(223,122,42,.14);color:var(--you)}
.node.ai{border-left-color:var(--ai)} .own.ai{background:rgba(124,111,214,.16);color:var(--ai)}
.node.code{border-left-color:var(--code)} .own.code{background:rgba(15,157,88,.14);color:var(--code)}
.node.art{border-left-color:var(--art);border-style:dashed} .own.art{background:rgba(138,133,120,.16);color:var(--art)}
.node.mix{border-left-color:var(--ai)}
.node.pot{border-left-color:var(--pot);border-style:dashed;background:#fdf6e8} .own.pot{background:rgba(201,138,30,.16);color:var(--pot)}
.node.gate{box-shadow:0 0 0 3px rgba(223,122,42,.18)}
.node.ghost{display:none}
.railhead{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:-8px}
.pulse{animation:pulse .7s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(223,122,42,.5)}100%{box-shadow:0 0 0 16px rgba(223,122,42,0)}}
path.w{fill:none;stroke-width:2}
path.flow{stroke:var(--code);stroke-dasharray:1 9;stroke-linecap:round;animation:dash 1.1s linear infinite}
path.feed{stroke:var(--ai);stroke-dasharray:5 5;opacity:.8}
path.tool{stroke:var(--art);stroke-dasharray:2 6;opacity:.75}
path.ghost{stroke:var(--pot);stroke-dasharray:4 6;opacity:.85}
@keyframes dash{to{stroke-dashoffset:-20}}
.detail{position:sticky;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--line);padding:14px 24px;min-height:92px}
.detail h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px;font-size:13px}
.detail .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.detail .you b{color:var(--you)} .detail .ai b{color:var(--ai)}
.stamp{font-size:11px;color:var(--muted)}
.hint{color:var(--muted)}
</style></head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="bar">
    <div class="legend">
      <span><i style="background:var(--you)"></i>&#128100; BẠN</span>
      <span><i style="background:var(--ai)"></i>&#129302; AI</span>
      <span><i style="background:var(--code)"></i>&#9881;&#65039; Code tự động</span>
      <span><i style="background:var(--art)"></i>&#128196; Dữ liệu</span>
      <span><i style="background:var(--pot)"></i>&#9889; Tiềm năng</span>
    </div>
    <div class="btns">
      <button id="play">&#9654; Chạy luồng</button>
      <button id="pot">&#9889; Tiềm năng khai thác</button>
    </div>
  </div>
</header>

<div class="diagram">
  <svg class="wires" id="wires"></svg>
  <div class="cols">
    <div class="col left"></div>
    <div class="col center"></div>
    <div class="col right"></div>
  </div>
</div>

<div class="detail" id="detail">
  <h3>&#128072; Bấm vào bất kỳ khối nào để xem: ai làm · input · output · ZONE sống</h3>
  <div class="hint">Xanh chạy = luồng dữ liệu · tím = config · xám = công cụ · vàng = tiềm năng (nút &#9889;). Badge xanh = ZONE tự quét từ code.</div>
</div>

st (= Cost Original × Quantity)", "# ============================================================", "def attach_cogs_to_orders(orders, cost):", "    orders = orders.merge(cost, on=\"SKU ID\", how=\"left\")", "    orders[\"Total Cost\"] = orders[\"Cost Original\"] * orders[\"Quantity\"]", "    return orders", "", "", "# ============================================================"]}, {"label": "03 · Onhold → cấp đơn", "key": "3", "status": "LOCKED", "in": "onhold thô (SKU-level) + cost", "out": "onhold gộp cấp đơn + cờ \"Chưa quyết toán\", rename cột khớp income", "funcs": ["process_onhold", "concat_bracket"], "line": 48, "body": ["# [ZONE 03 · Onhold → cấp đơn]                 Status: LOCKED", "# In : onhold thô (SKU-level) + cost", "# Out: onhold gộp cấp đơn + cờ \"Chưa quyết toán\", rename cột khớp income", "# ============================================================", "def process_onhold(onhold_raw, cost):", "    onhold_raw = onhold_raw.merge(cost.rename(columns={\"SKU ID\": \"ID SKU\"}), on=\"ID SKU\", how=\"left\")", "    onhold_raw[\"Total Cost\"] = onhold_raw[\"Cost Original\"] * onhold_raw[\"Số lượng\"]", "", "    def concat_bracket(x):", "        return \" | \".join(f\"[{v}]\" for v in x.dropna().astype(str).unique())", "", "    agg = {}", "    for col in onhold_raw.columns:", "        if col == \"ID đơn hàng/điều chỉnh\":", "            continue", "        if col in [\"Tên sản phẩm\", \"Tên SKU\", \"ID SKU\"]:", "            agg[col] = concat_bracket", "        elif pd.api.types.is_numeric_dtype(onhold_raw[col]):", "            agg[col] = \"sum\"", "        else:", "            agg[col] = \"first\"", "    onhold_agg = onhold_raw.groupby(\"ID đơn hàng/điều chỉnh\", as_index=False).agg(agg)", "    onhold_agg[\"Num_SKUs\"] = onhold_raw.groupby(\"ID đơn hàng/điều chỉnh\").size().values", "", "    onhold_agg = onhold_agg.rename(columns={", "        \"Ngày tạo giao dịch\": \"Thời gian tạo đơn hàng\",", "        \"Thời gian quyết toán dự kiến\": \"Thời gian qu {len(income)} (bán + hoàn triệt tiêu)\")", "    return income", "", "", "# ============================================================"]}, {"label": "05 · Nối Đã/Chưa + COGS cấp đơn", "key": "5", "status": "LOCKED", "in": "income (đã gộp) + onhold_agg + orders (có Total Cost)", "out": "1 bảng gộp + cột Cost_COGS mỗi đơn", "funcs": ["merge_settled_onhold", "attach_cogs"], "line": 110, "body": ["# [ZONE 05 · Nối Đã/Chưa + COGS cấp đơn]       Status: LOCKED", "# In : income (đã gộp) + onhold_agg + orders (có Total Cost)", "# Out: 1 bảng gộp + cột Cost_COGS mỗi đơn", "# ============================================================", "def merge_settled_onhold(income, onhold_agg):", "    income = income.copy()", "    income[\"ID đơn hàng/điều chỉnh\"] = income[\"ID đơn hàng/điều chỉnh\"].astype(str)", "    income[\"Trạng thái quyết toán\"] = \"Đã quyết toán\"", "    return pd.concat([income, onhold_agg], ignore_index=True, sort=False)", "", "", "def attach_cogs(income, orders):", "    cogs = orders.groupby(\"Order ID\", as_index=False)[\"Total Cost\"].sum()", "    cogs.columns = [\"Order ID\", \"Cost_COGS\"]", "    return income.merge(cogs, left_on=\"ID đơn hàng/điều chỉnh\", right_on=\"Order ID\", how=\"left\")", "", "", "# ============================================================"]}, {"label": "06 · Gom phí 4 nhóm", "key": "6", "status": "LOCKED", "in": "income (cột phí lẻ) + config.COST_GROUPS", "out": "income + Cost_Platform / Cost_KOC / Cost_Ads (bỏ cột phí lẻ)", "funcs": ["group_costs"], "line": 128, "body": ["# [ZONE 06 · Gom phí 4 nhóm]                   Status: LOCKED (config-driven)", "# In : income (cột phí lẻ) + config.COST_GROUPS", "# Out: income + Cost_Platform / Cost_KOC / Cost_Ads (bỏ cột phí lẻ)", "# ============================================================", "def group_costs(income):", "    p = [c for c in clean.COST_GROUPS[\"platform\"] if c in income.columns]", "    k = [c for c in clean.COST_GROUPS[\"koc\"] if c in income.columns]", "    a = [c for c in clean.COST_GROUPS[\"ads\"] if c in income.columns]", "    income[\"Cost_Platform\"] = income[p].fillna(0).sum(axis=1)", "    income[\"Cost_KOC\"] = income[k].fillna(0).sum(axis=1)", "    income[\"Cost_Ads\"] = income[a].fillna(0).sum(axis=1)", "    return income.drop(columns=p + k + a)", "", "", "# ============================================================"]}, {"label": "07 · Chọn cột lõi + làm giàu đơn", "key": "7", "status": "LOCKED", "in": "income + orders", "out": "income gọn cột + kênh/SP/trạng thái đơn", "funcs": ["select_core_columns", "enrich_order_info"], "line": 143, "body": ["# [ZONE 07 · Chọn cột lõi + làm giàu đơn]      Status: LOCKED", "# In : income + orders", "# Out: income gọn cột + kênh/SP/trạng thái đơn", "# ============================================================", "def select_core_columns(income):", "    income = income[[\"ID đơn hàng/điều chỉnh\", \"Loại giao dịch\", \"Thời gian tạo đơn hàng\",", "                     \"Thời gian quyết toán đơn hàng\", \"Tổng số tiền quyết toán\", \"Tổng doanh thu\",", "                     \"Tổng phí\", \"Order ID\", \"Cost_COGS\", \"Cost_Platform\", \"Cost_KOC\", \"Cost_Ads\",", "                     \"Trạng thái quyết toán\"]].copy()", "    income[\"ID đơn hàng/điều chỉnh\"] = income[\"ID đơn hàng/điều chỉnh\"].astype(str)", "    return income", "", "", "def enrich_order_info(income, orders):", "    info = orders.groupby(\"Order ID\").agg(", "        Order_Channel=(\"Order Channel\", \"first\"),", "        Product_Names=(\"Product Name\", lambda x: \" | \".join(x.dropna().unique())),", "        Variations=(\"Variation\", lambda x: \" | \".join(f\"[{v}]\" for v in x.dropna().unique())),", "        Total_Quantity=(\"Quantity\", \"sum\"),", "        Num_SKUs=(\"SKU ID\", \"nunique\"),", "        Order_Status=(\"Order Status\", \"first\"),", "        Order_Substatus=(\"Order Substatus\", \"first\"),", "        Cancel_Return_Type=(\"Cancelation/Return Type\", \"first\"),", "    ).reset_index()", "    income = income.merge(info, left_on=\"ID đơn hàng/điều chỉnh\", right_on=\"Order ID\", how=\"left\")", "    if \"Order ID_y\" in income.columns:", "        income = income.drop(columns=[\"Order ID_y\"])", "    return income", "", "", "# ============================================================"]}, {"label": "08 · Chỉ số phái sinh / ROI", "key": "8", "status": "DRAFT", "in": "income (doanh thu + 4 nhóm chi phí)", "out": "Abs_*, All_Cost, Net_Margin, các ROI, cost-mix %, cờ", "funcs": ["add_derived_metrics"], "line": 174, "body": ["# [ZONE 08 · Chỉ số phái sinh / ROI]           Status: DRAFT (đang chuẩn chỉnh - review ROI)", "# In : income (doanh thu + 4 nhóm chi phí)", "# Out: Abs_*, All_Cost, Net_Margin, các ROI, cost-mix %, cờ", "# ============================================================", "def add_derived_metrics(income):", "    income[\"Abs_COGS\"] = -income[\"Cost_COGS\"]", "    income[\"Abs_Platform\"] = -income[\"Cost_Platform\"]", "    income[\"Abs_KOC\"] = -income[\"Cost_KOC\"]", "    income[\"Abs_Ads\"] = -income[\"Cost_Ads\"]", "    income[\"All_Cost\"] = income[[\"Abs_COGS\", \"Abs_Platform\", \"Abs_KOC\", \"Abs_Ads\"]].sum(axis=1)", "    income[\"Net_Margin\"] = income[\"Tổng doanh thu\"] - income[\"All_Cost\"]", "    income[\"Net_Margin_Pct\"] = (income[\"Net_Margin\"] / income[\"Tổng doanh thu\"]).round(3)", "    income[\"Gross_ROI\"] = (income[\"Tổng doanh thu\"] / income[\"Abs_COGS\"]).where(income[\"Abs_COGS\"] > 0).round(2)", "    income[\"ROAS\"] = (income[\"Tổng doanh thu\"] / income[\"Abs_Ads\"]).where(income[\"Abs_Ads\"] > 0).round(2)", "    income[\"Marketing_Spend\"] = income[\"Abs_Ads\"] + income[\"Abs_KOC\"]", "    income[\"Marketing_ROI\"] = (income[\"Tổng doanh thu\"] / income[\"Marketing_Spend\"]).where(income[\"Marketing_Spend\"] > 0).round(2)", "    income[\"Net_ROI\"] = (income[\"Tổng doanh thu\"] / income[\"All_Cost\"]).where(income[\"All_Cost\"] > 0).round(2)", "    income[\"Has_Ads\"] = income[\"Abs_Ads\"] > 0", "    income[\"Has_KOC\"] = income[\"Abs_KOC\"] > 0", "    income[\"Is_Profitable\"] = income[\"Net_Margin\"] > 0", "    income[\"Is_Cancelled\"] = (income[\"Tổng phí\"] != 0) & (income[\"Tổng doanh thu\"] == 0)", "    for col, abscol in [(\"COGS_Pct\", \"Abs_COGS\"), (\"Platform_Pct\", \"Abs_Platform\"),", "                        (\"KOC_Pct\", \"Abs_KOC\"), (\"Ads_Pct\", \"Abs_Ads\")]:", "        income[col] = (income[abscol] / income[\"Tổng doanh thu\"]).where(income[\"Tổng doanh thu\"] > 0).round(3)", "    for col in [\"Net_Margin_Pct\", \"Gross_ROI\", \"ROAS\", \"Marketing_ROI\", \"Net_ROI\",", "                \"COGS_Pct\", \"Platform_Pct\", \"KOC_Pct\", \"Ads_Pct\"]:", "        income[col] = income[col].replace([np.inf, -np.inf], np.nan)", "    return income", "", "", "# ============================================================"]}, {"label": "09 · Phân loại đơn + hậu kỳ", "key": "9", "status": "LOCKED", "in": "income (Order_Status, Cancel_Return_Type...)", "out": "cột \"Loại đơn\"; bỏ dòng GMV ads; zero COGS đơn hủy trước ship", "funcs": ["classify_order_type", "post_process"], "line": 205, "body": ["# [ZONE 09 · Phân loại đơn + hậu kỳ]           Status: LOCKED", "# In : income (Order_Status, Cancel_Return_Type...)", "# Out: cột \"Loại đơn\"; bỏ dòng GMV ads; zero COGS đơn hủy trước ship", "# ============================================================", "def classify_order_type(income):", "    cond = [", "        income[\"Cancel_Return_Type\"] == \"Return/Refund\",", "        (income[\"Order_Status\"] == \"Đã hủy\") & (income[\"Cancel_Return_Type\"] == \"Cancel\"),", "        income[\"Order_Status\"] == \"Cần vận chuyển\",", "        income[\"Order_Status\"] == \"Đã hoàn tất\",", "        (income[\"Order_Status\"] == \"Đã vận chuyển\") & (income[\"Order_Substatus\"] == \"Đã giao\"),", "        income[\"Order_Status\"] == \"Đã vận chuyển\",", "    ]", "    choices = [\"Trả hàng sau giao\", \"Hủy trước ship\", \"Chờ ship\", \"Hoàn tất\",", "               \"Đã giao t const N = {};
D.nodes.forEach(n => N[n.id] = n);
const qs = s => document.querySelector(s);
const col = {left: qs('.col.left'), center: qs('.col.center'), right: qs('.col.right')};
qs('#title').textContent = D.title;
document.title = D.title;

// rail headers
Object.keys(D.rails).forEach(k => {
  const h = document.createElement('div'); h.className = 'railhead'; h.textContent = D.rails[k];
  col[k].appendChild(h);
});
// nodes
D.nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = 'node ' + n.owner + (n.ghost ? ' ghost' : '') + (n.gate ? ' gate' : '');
  el.dataset.id = n.id;
  const badge = n.badge ? `<span class="live">&#9881;&#65039; ${n.badge}</span>` : '';
  el.innerHTML = `<div class="t">${n.title}</div><div class="io">${n.io}</div>`
    + `<span class="own ${n.owner}">${n.ownt}</span>${badge}`;
  el.onclick = () => select(n.id, el);
  col[n.col].appendChild(el);
});

function select(id, el) {
  document.querySelectorAll('.node').forEach(x => x.classList.remove('sel'));
  if (el) el.classList.add('sel');
  const d = N[id];
  let zoneHtml = '';
  if (d.zones && d.zones.length) {
    const items = d.zones.map(z => {
      const ic = z.status === 'LOCKED' ? '&#128274;' : (z.status === 'DRAFT' ? '&#9999;&#65039;' : '&#8226;');
      return `${ic} ${z.label}`;
    }).join(' &nbsp;&nbsp; ');
    zoneHtml = `<div style="grid-column:1/-1"><div class="k">&#9881;&#65039; ZONE SỐNG (tự quét từ code)</div>${items}</div>`;
  }
  qs('#detail').innerHTML =
    `<h3>${d.title} <span class="own ${d.owner}" style="font-size:11px">${d.ownt}</span>`
    + `<span class="stamp">· ${d.st}${d.badge ? ' · ' + d.badge : ''}</span></h3>`
    + `<div class="grid">`
    + `<div><div class="k">&#11015; Input</div>${d['in']}</div>`
    + `<div><div class="k">&#11014; Output</div>${d.out}</div>`
    + `<div class="you"><div class="k">&#128100; Bạn làm gì</div>${d.you}</div>`
    + `<div class="ai"><div class="k">&#129302; AI làm gì</div>${d.ai}</div>`
    + zoneHtml + `</div>`;
}

// wires
const dia = qs('.diagram'), svg = qs('#wires');
function box(id) {
  const e = document.querySelector(`[data-id="${id}"]`);
  if (!e || getComputedStyle(e).display === 'none') return null;
  const r = e.getBoundingClientRect(), d = dia.getBoundingClientRect();
  return {l: r.left - d.left, t: r.top - d.top, r: r.right - d.left, b: r.bottom - d.top,
          cx: r.left - d.left + r.width / 2, cy: r.top - d.top + r.height / 2};
}
function draw() {
  svg.innerHTML = '';
  svg.setAttribute('width', dia.scrollWidth); svg.setAttribute('height', dia.scrollHeight);
  for (const [a, b, kind] of D.edges) {
    const A = box(a), B = box(b); if (!A || !B) continue;
    const dx = B.cx - A.cx, dy = B.cy - A.cy; let p1, p2;
    if (Math.abs(dx) >= Math.abs(dy)) { p1 = {x: dx > 0 ? A.r : A.l, y: A.cy}; p2 = {x: dx > 0 ? B.l : B.r, y: B.cy}; }
    else { p1 = {x: A.cx, y: dy > 0 ? A.b : A.t}; p2 = {x: B.cx, y: dy > 0 ? B.t : B.b}; }
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const dd = Math.abs(dx) >= Math.abs(dy)
      ? `M${p1.x},${p1.y} C${mx},${p1.y} ${mx},${p2.y} ${p2.x},${p2.y}`
      : `M${p1.x},${p1.y} C${p1.x},${my} ${p2.x},${my} ${p2.x},${p2.y}`;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', dd); path.setAttribute('class', 'w ' + kind);
    svg.appendChild(path);
  }
}
let potOn = false;
qs('#pot').onclick = e => {
  potOn = !potOn; e.target.classList.toggle('on', potOn);
  document.querySelectorAll('.node.ghost, .node.pot').forEach(g => {
    if (N[g.dataset.id] && N[g.dataset.id].ghost) g.style.display = potOn ? 'block' : 'none';
  });
  setTimeout(draw, 20);
};
qs('#play').onclick = () => {
  D.play.forEach((id, i) => setTimeout(() => {
    const el = document.querySelector(`[data-id="${id}"]`);
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
    select(id, el);
  }, i * 650));
};
window.addEventListener('resize', draw);
draw();
const gate = D.nodes.find(n => n.gate);
if (gate) select(gate.id, document.querySelector(`[data-id="${gate.id}"]`));
</script>
